name: CONFLORA — V14 Preview

on:
  push:
    branches:
      - feat/conflora-v14-area-intelligence-20261116
    paths:
      - "projeto/**"
      - ".github/workflows/preview-v14.yml"

permissions:
  contents: write

concurrency:
  group: conflora-v14-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projeto/package-lock.json
      - name: Install dependencies
        working-directory: projeto
        run: npm ci
      - name: Build and verify research and source integrity
        working-directory: projeto
        run: |
          npm run build
          npm test
          npm run test:selection
          node tests/science.mjs
          node tests/v14-analysis.mjs
      - name: Install Chromium
        working-directory: projeto
        run: |
          npx playwright install --with-deps chromium
          sudo ln -sf "$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" /usr/bin/chromium
      - name: Browser end-to-end checks
        working-directory: projeto
        run: |
          npm run dev -- --port 5176 > /tmp/conflora-v14-vite.log 2>&1 &
          for n in $(seq 1 45); do if curl -fsS http://localhost:5176/ > /dev/null; then break; fi; sleep 1; done
          node tests/science-browser.mjs
          node tests/v14-browser.mjs
          npm run test:herbarium
      - name: Publish isolated V14 preview (preserve official root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./projeto/dist
          destination_dir: previews/conflora-v14
          keep_files: true
          commit_message: "Preview CONFLORA V14: ${{ github.sha }}"
