*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--chalk);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button,input,select,textarea{outline-offset:3px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid #47B1AB;outline-offset:3px}::selection{background:var(--lime);color:var(--pine)}a{color:inherit}.sr-only{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}.caps{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:700}.mononum{font-variant-numeric:tabular-nums}.muted{color:var(--mute)}.small{font-size:14px}.tiny{font-size:12px}.strong{font-weight:700}.accent{color:var(--aqua)}.offwhite{color:var(--chalk)}.site-shell{min-height:100vh;display:flex;flex-direction:column}.header{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--pine);padding:16px clamp(20px,4.5vw,72px);min-height:82px;color:var(--chalk);border-bottom:1px solid rgba(255,255,255,.14)}.brand{border:0;background:none;color:inherit;display:flex;align-items:center;gap:14px;padding:0}.brand img{width:40px;height:40px;object-fit:contain;mix-blend-mode:normal}.brand-name{display:block;letter-spacing:.17em;font-size:17px;font-weight:750;line-height:1.1}.brand-byline{display:block;letter-spacing:.14em;font-size:9px;color:#A7C5B9;margin-top:6px;font-weight:650}.top-links{display:flex;align-items:center;gap:6px}.nav-link{background:transparent;color:#C9D9D1;border:0;padding:10px 13px;border-radius:8px;font-size:14px}.nav-link:hover,.nav-link[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff}.head-actions{display:flex;gap:10px;align-items:center}.lang-toggle{border:1px solid #6B8479;background:transparent;color:#fff;border-radius:20px;padding:8px 12px;font-size:12px;font-weight:800;letter-spacing:.09em}.plain-icon{border:1px solid rgba(255,255,255,.27);border-radius:50%;width:36px;height:36px;background:none;color:#fff;font-size:18px}.top-nav-mobile{display:none}.footer{margin-top:auto;background:var(--deep);color:#BDD3C7;padding:28px clamp(20px,4.5vw,72px);display:flex;align-items:center;justify-content:space-between;gap:18px;font-size:13px}.footer b{color:#fff;letter-spacing:.14em}.footer p{margin:0;max-width:600px}

.entry{background:var(--pine);color:var(--chalk);flex:1}.entry-main{max-width:1690px;margin:auto;min-height:min(790px,calc(100vh - 200px));display:grid;grid-template-columns:.88fr 1.12fr;gap:clamp(35px,5vw,95px);align-items:center;padding:clamp(35px,6vw,96px) clamp(20px,5.5vw,90px)}.entry-copy{padding-bottom:20px}.rule-intro{display:flex;align-items:center;gap:14px;color:var(--lime);font-size:12px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;margin-bottom:32px}.rule-intro:before{content:"";width:42px;height:1px;background:var(--lime)}h1,h2,h3,p{margin-top:0}h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,6.6vw,110px);letter-spacing:-.055em;line-height:.99;margin-bottom:30px}h1 em{color:var(--lime);font-weight:400;white-space:normal}.entry-lede{font-size:clamp(17px,1.3vw,20px);line-height:1.65;color:#D0E0D4;max-width:510px;margin-bottom:32px}.entry-privacy{display:flex;gap:12px;align-items:flex-start;max-width:500px;margin:26px 0 0;font-size:13px;color:#A2C3B2}.entry-privacy:before{content:"•";color:var(--lime);font-size:25px;line-height:13px}.entry-visual{position:relative;min-width:0}.entry-art{background:#F0F0E4;overflow:hidden;border-radius:2px;box-shadow:0 40px 95px rgba(0,0,0,.24);border:11px solid #F0EEE5;aspect-ratio:1.28}.entry-art svg{height:100%;width:100%;display:block}.entry-art-plate{position:absolute;top:-19px;right:18px;background:var(--lime);color:var(--pine);padding:12px 19px;font-size:11px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;transform:rotate(2deg);box-shadow:0 7px 20px rgba(0,0,0,.13)}.entry-art-caption{position:absolute;left:-28px;bottom:30px;background:var(--paper);color:var(--ink);padding:18px 22px;max-width:330px;box-shadow:var(--shadow)}.entry-art-caption p{font-size:14px;margin:3px 0 0;color:#526B5A}.entry-art-caption strong{font-family:var(--serif);font-size:25px;font-weight:400}.entry-stat{position:absolute;top:44%;right:-14px;background:var(--pine);color:#fff;border:1px solid #5273 <script>
/* CONFLORA V11: local-first project persistence, no network or analytics. */
window.CONFLORA_STORE = (() => {
 const DB='conflora-v11-local', TABLE='projects'; let dbPromise;
 function open(){
  if(!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB indisponível'));
  if(!dbPromise) dbPromise=new Promise((resolve,reject)=>{
   const req=indexedDB.open(DB,1);
   req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(TABLE))d.createObjectStore(TABLE,{keyPath:'id'});};
   req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error||Error('Erro ao abrir banco'));
  });return dbPromise;
 }
 async function tx(mode,fn){const db=await open();return new Promise((resolve,reject)=>{
   const tr=db.transaction(TABLE,mode), s=tr.objectStore(TABLE);let req,result;
   tr.oncomplete=()=>resolve(result);tr.onabort=()=>reject(tr.error||Error('Transação cancelada'));tr.onerror=()=>reject(tr.error||Error('Falha no armazenamento'));
   try{req=fn(s);}catch(e){tr.abort();reject(e);return;}
   req.onsuccess=()=>{result=req.result};req.onerror=()=>reject(req.error);
  });}
 async function save(p){const clean=structuredClone(p);clean.updatedAt=Date.now();return tx('readwrite',s=>s.put(clean));}
 function load(id){return tx('readonly',s=>s.get(id));}
 function all(){return tx('readonly',s=>s.getAll());}
 function remove(id){return tx('readwrite',s=>s.delete(id));}
 function id(){return 'cfl-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);}
 function newProject(kind='space') {const now=Date.now();return {version:11,id:id(),createdAt:now,updatedAt:now,name:'Meu espaço',image:null,annotations:[],context:{region:'',area:'',soil:'unknown',sun:'unknown',pooling:'unknown',notes:''},kit:{code:'',tasks:[false,false,false,false,false],entries:[]},kind};}
 return {save,load,all,remove,id,newProject};
})();

function header(){return `<header class="header"><button class="brand" data-action="home" aria-label="CONFLORA — ${T('navHome')}"><img alt="" src="${logo}"><span><span class="brand-name">CONFLORA</span><span class="brand-byline">${T('brandLine')}</span></span></button><nav class="top-links" aria-label="${T('navHome')}"><button class="nav-link" data-action="home" ${S.view==='home'?'aria-current="page"':''}>${T('navHome')}</button><button class="nav-link" data-action="open-editor" ${S.view==='editor'?'aria-current="page"':''}>${T('navSpace')}</button><button class="nav-link" data-action="open-kit" ${S.view==='kit'?'aria-current="page"':''}>${T('navKit')}</button><button class="nav-link" data-action="library">${T('navProjects')}</button></nav><div class="head-actions"><button class="lang-toggle" data-action="lang" aria-label="${S.lang==='pt'?'Switch to English':'Mudar para português'}">${S.lang==='pt'?'EN':'PT'}</button><button class="plain-icon" data-action="mobile-menu" aria-label="${T('menu')}" title="${T('menu')}">☰</button></div></header>`;}
function footer(){return `<footer class="footer"><b>CONFLORA</b><p>${T('footer')}</p><span>${T('localOnly')} · BRaVE 2026</span></footer>`;}
function entry(){const tmp=Store.newProject();tmp.annotations=[{id:'preview1',x:680,y:250,size:1,type:'pool',notes:''},{id:'preview2',x:505,y:440,size:.95,type:'garden',notes:''}];return `<main class="entry"><div class="entry-main"><section class="entry-copy"><div class="rule-intro">${T('headTag')}</div><h1>${T('heroA')} <em>${T('heroB')}</em></h1><p class="entry-lede">${T('heroLead')}</p><div class="button-row"><button class="primary" data-action="new-photo"><span class="icon-text" aria-hidden="true">↗</span>${T('startPhoto')}</button><button class="secondary" data-action="new-blank">${T('startBlank')}</button></div><div class="entry-secondary"><button class="underlined" data-action="new-kit">${T('haveKit')} ↗</button><button class="underlined" data-action="library">${T('navProjects')} ↗</button></div><p class="entry-privacy">${T('privacy')}</p></section><div class="entry-visual" aria-label="${T('schematic')}"><div class="entry-art">${Ed.svgContent(tmp,{labels:I18N[S.lang],svgLabel:T('schematic')})}</div><div class="entry-art-plate">${T('artTag')}</div><div class="entry-art-caption"><strong>${T('artTitle')}</strong><p>${T('artSub')}</p></div><div class="entry-stat" aria-hidden="true"><div><span>01</span>${S.lang==='pt'?'ESPAÇO REAL':'REAL SPACE'}</div></div></div></div><div class="journey-bar"><div><span>01</span>${T('stepOne')}</div><div><span>02</span>${T('stepTwo')}</div><div><span>03</span>${T('stepThree')}</div></div></main>`;}
function sectionTop(){const name=E(S.project?.name||T('projectName'));let title=S.view==='editor'?T('workspace'):S.view==='compare'?T('comparisonHeading'):S.view==='plan'?T('planHeading'):T('kitHeading');const intro=S.view==='editor'?T('workspaceSummary'):S.view==='compare'?T('comparisonSub'):S.view==='plan'?T('planIntro'):T('kitIntro');const steps=[['editor',T('editor'),'01'],['compare',T('compare'),'02'],['plan',T('plan'),'03'],['kit',T('kit'),'04']];return `<div class="section-top"><div class="section-breadcrumb">CONFLORA <span aria-hidden="true">/</span> ${T('projectName')}</div>${S.view==='editor'?`<h1><input id="project-name" class="project-name" data-project-name aria-label="${T('projectName')}" value="${name}" maxlength="100"></h1>`:`<h1>${title}</h1>`}<p class="section-summary">${intro}</p><div class="subnav"><div class="subnav-left" role="navigation" aria-label="${T('navSpace')}">${steps.map(([v,text,n])=>`<button data-action="goto" data-view="${v}" class="step-tab" ${S.view===v?'aria-current="step"':''}><small>${n}</small>${text}</button>`).join('')}</div><div class="subnav-right"><span class="save-status" id="save-status">${S.dirty?T('unsaved'):T('saved')}</span><button class="smallbtn" data-action="save">${T('save')}</button><button class="smallbtn" data-action="library">${T('navProjects')}</button></div></div></div>`;}
function rail(){const tools=[['select','#F0F7EA'],['pool','#4CBCC4'],['roof','#39879B'],['paved','#C28A6C'],['plants','#7FC592'],['space','#CFA06F'],['garden','#B4E58C'],['pan','#BDD8C8']];return `<aside class="worktools" aria-label="${T('tools')}"><p class="rail-title">${T('tools')}</p>${tools.map(([id,col])=>`<button class="rail-tool ${S.tool===id?'active':''}" data-tool="${id}" aria-pressed="${S.tool===id}" style="--dot:${col}"><span class="tool-dot" aria-hidden="true"></span><span>${T(id)}</span></button>`).join('')}<div class="rail-divider"></div><div class="rail-actions"><button data-action="undo" ${!S.history.length?'disabled':''} title="${T('undo')}">↶ ${T('undo')}</button><button data-action="redo" ${!S.future.length?'disabled':''} title="${T('redo')}">↷ ${T('redo')}</button></div><p class="rail-foot">${T('editorHint')}</p></aside>`;}
function selectMark(){return S.project?.annotations?.find(a=>a.id===S.selected);}
function markPanel(){const sel=selectMark(),items=S.project.annotations||[];return `<aside class="inspector"><div class="subhead">${T('tabDetails')}</div><h3>${T('markDetails')}</h3><p class="minor">${T('markDesc')}</p>${sel?`<div class="notice"><b>${T(sel.type)}</b><br><span class="small">${T('selected')}</span></div><label for="marker-notes">${T('markNotes')}</label><textarea id="marker-notes" data-marker-notes placeholder="${E(T('markNotesPlaceholder'))}" maxlength="700">${E(sel.notes||'')}</textarea><label for="marker-size">${T('scale')}</label><input id="marker-size" type="range" min="0.55" max="2.4" step="0.05" value="${Ed.clamp(+sel.size||1,.55,2.4)}" data-marker-size><div class="inline-input"><label>${T('position')} X<input type="number" min="20" max="980" value="${Math.round(sel.x)}" data-marker-pos="x"></label><label>Y<input type="number" min="20" max="630" value="${Math.round(sel.y)}" data-marker-pos="y"></label></div><div class="side-actions"><button class="smallbtn dangerbtn" data-action="delete-marker">${T('deleteMark')}</button></div>`:`<div class="notice">${T('editorHint')}</div><div class="side-actions"><button class="smallbtn" data-action="add-center">${T('addCenter')}</button></div>`}<hr><div class="subhead">${T('observations')} · ${items.length}</div><div class="mark-list">${items.length?items.map(a=>`<button class="mark-item ${S.selected===a.id?'active':''}" data-action="select-marker" data-id="${E(a.id)}"><span class="mark-dot" style="background:${({pool:'#43B8C2',roof:'#3E899F',paved:'#B78466',plants:'#48805F',space:'#C48B5F',garden:'#5E8E65'})[a.type]||'#477'}"></span><span class="mark-text">${T(a.type)}</span><span aria-hidden="true">↗</span></button>`).join(''):`<p class="empty-state">${T('noMarks')}</p>`}</div><hr><p class="minor">${T('photoNote')}</p></aside>`;}
function projectEditor(){const picture=Ed.svgContent(S.project,{labels:I18N[S.lang],selected:S.selected,viewBox:viewBox(),svgLabel:T('scene')});return `${sectionTop()}<main class="workmain"><div class="workbench">${rail()}<section class="canvas-column"><div class="editor-head"><span class="smallcaps">${S.project.image?T('myPhoto'):T('schematic')}</span><div class="tools-right"><button class="mini-ctl" data-action="change-photo" title="${T('changePhoto')}">▣</button><button class="mini-ctl" data-action="zoom-out" title="${T('zoomOut')}">−</button><button class="mini-ctl" data-action="zoom-in" title="${T('zoomIn')}">+</button><button class="mini-ctl" data-action="zoom-reset" title="${T('resetView')}">⟲</button><button class="mini-ctl" data-action="undo" ${!S.history.length?'disabled':''} title="${T('undo')}">↶</button><button class="mini-ctl" data-action="redo" ${!S.future.length?'disabled':''} title="${T('redo')}">↷</button></div></div><div id="stage" class="workspace-stage" data-tool="${S.tool}" tabindex="0" role="group" aria-label="${E(T('scene'))}" aria-describedby="editor-help">${picture}</div><p class="workspace-footer" id="editor-help"><span>${T('editorHint')}</span><b>${S.project.annotations.length} ${T('marksCount')}</b></p><div class="button-row"><button class="inkbtn" data-action="goto" data-view="compare">${T('compare')} →</button><button class="secondary" data-action="goto" data-view="plan">${T('goPlan')}</button></div></section>${markPanel()}</div></main>`;}
function compareView(){const gardens=S.project.annotations.filter(a=>a.type==='garden').length;const art=Ed.svgContent(S.project,{labels:I18N[S.lang],compare:true,fraction:S.compare,viewBox:'0 0 1000 650',beforeText:T('before'),afterText:T('after'),svgLabel:T('scene')});return `${sectionTop()}<main class="workmain"><div class="document-layout" style="max-width:1450px;padding-top:22px;grid-template-columns:minmax(0,1.45fr) minmax(270px,.55fr)"><section><div class="editor-head"><span class="smallcaps">${T('before')} ↔ ${T('after')}</span><span class="muted tiny">${T('areaOfGarden')}</span></div><div class="workspace-stage">${art}</div><div class="compare-line"><span>${T('after')}</span><input type="range" min="0" max="100" step="1" data-compare value="${S.compare}" aria-label="${T('compare')}"><span>${T('before')}</span></div><p class="stage-note">${T('comparisonInfo')}</p></section><aside class="doc-panel"><div class="caps muted">02 / ${T('preview')}</div><h2>${T('comparisonSide')}</h2><p>${T('comparisonInfo')}</p>${gardens?`<p><b>${gardens}</b> ${T('garden')}</p>`:`<div class="notice warn">${T('comparisonEmpty')}</div>`}<div class="button-row" style="margin-top:25px"><button class="secondary" data-action="goto" data-view="editor">${T('backEditor')}</button><button class="inkbtn" data-action="goto" data-view="plan">${T('goPlan')} ↗</button></div></aside></div></main>`;}
function options(keys,current){return keys.map(k=>`<option value="${k}" ${current===k?'selected':''}>${T(k==='unknown'?'unknown':k)}</option>`).join('');}
function safeChoice(field,keys){return keys.map(k=>`<option value="${k}" ${S.project.context[field]===k?'selected':''}>${T(k==='unknown'?'unknown':k==='slow'?'soilSlow':k==='medium'?'soilMedium':k==='fast'?'soilFast':k==='full'?'sunFull':k==='mixed'?'sunMixed':k==='shade'?'sunShade':k)}</option>`).join('');}
function getChecks(){const a=[T('check1'),T('check2'),T('check3'),T('check4'),T('check5')];if(S.project?.context?.pooling==='yes'||S.project.annotations.some(m=>m.type==='pool'))a.unshift(T('check6'));return a;}
function planView(){const c=S.project.context,counts=S.project.annotations.length;return `${sectionTop()}<main class="workmain"><div class="document-layout"><section class="doc-panel"><div class="caps muted">03 / ${T('planned')}</div><h2>${T('planFormTitle')}</h2><p>${T('planIntro')}</p><div class="form-block"><label for="ctx-region">${T('where')}</label><input id="ctx-region" data-context="region" value="${E(c.region)}" placeholder="${E(T('wherePlaceholder'))}" maxlength="120"></div><div class="fieldrow"><div class="form-block"><label for="ctx-area">${T('area')}</label><input id="ctx-area" data-context="area" type="number" inputmode="decimal" min="0" max="10000000" step="0.1" value="${E(c.area)}"><p class="help">${T('areaHelp')}</p></div><div class="form-block"><label for="ctx-soil">${T('soil')}</label><select id="ctx-soil" data-context="soil">${safeChoice('soil',['unknown','slow','medium','fast'])}</select></div></div><div class="fieldrow"><div class="form-block"><label for="ctx-sun">${T('sun')}</label><select id="ctx-sun" data-context="sun">${safeChoice('sun',['unknown','full','mixed','shade'])}</select></div><div class="form-block"><label for="ctx-pooling">${T('poolingQuestion')}</label><select id="ctx-pooling" data-context="pooling">${safeChoice('pooling',['unknown','yes','no'])}</select></div></div><div class="form-block"><label for="ctx-notes">${T('notes')}</label><textarea id="ctx-notes" data-context="notes" maxlength="2000">${E(c.notes)}</textarea></div><div class="button-row"><button class="inkbtn" data-action="report">${T('openReport')} ↗</button><button class="secondary" data-action="export-json">${T('exportProject')}</button><button class="secondary" data-action="import-json">${T('importProject')}</button></div></section><aside class="doc-panel summary-block"><div class="caps muted">${T('planSummary')}</div><h2>${counts} ${T('marksCount')}</h2><ul class="plan-annotation-list">${counts?S.project.annotations.map(a=>`<li><b>${T(a.type)}</b>${E(a.notes||T('noteEmpty'))}</li>`).join(''):`<li>${T('noMarked')}</li>`}</ul><h3 class="subhead">${T('nextChecks')}</h3><ol class="steps-list">${getChecks().map(c=>`<li>${c}</li>`).join('')}</ol><div class="notice warn">${T('planRisk')}</div></aside></div></main>`;}
function kitView(){const k=S.project.kit,taskIDs=[1,2,3,4,5];return `${sectionTop()}<main class="workmain"><div class="document-layout"><section class="doc-panel"><span class="kit-label">${T('kitDraft')}</span><h2 style="margin-top:15px">${T('kitFormTitle')}</h2><p>${T('kitIntro')}</p><div class="form-block"><label for="kit-code">${T('kitCode')}</label><input id="kit-code" data-kit-code maxlength="100" value="${E(k.code)}" placeholder="${E(T('kitCodePlaceholder'))}"></div><div class="subhead">${T('kitChecklist')}</div>${taskIDs.map((id,i)=>`<label class="kit-step"><input type="checkbox" data-kit-task="${i}" ${k.tasks[i]?'checked':''}><span><strong>${T('kitTask'+id)}</strong><small>${S.lang==='pt'?'Registro pessoal. Não substitui o manual do kit.':'Personal record. Not a substitute for the kit manual.'}</small></span></label>`).join('')}<div class="notice warn" style="margin-top:22px">${T('kitLimit')}</div></section><aside class="doc-panel"><div class="caps muted">${T('journalDate')}</div><h2>${T('kitJournal')}</h2><p>${T('kitJournalIntro')}</p><label for="journal-note">${T('journalText')}</label><textarea id="journal-note" placeholder="${E(T('journalTextPH'))}" maxlength="1500"></textarea><div class="button-row" style="margin-top:10px"><button class="smallbtn" data-action="kit-photo">${T('journalPhoto')}</button><button class="inkbtn" data-action="kit-add-entry">${T('journalSave')}</button></div>${S.pendingKitPhoto?`<p class="small muted" id="pending-kit-photo">✓ ${T('journalPhoto')}</p>`:''}<hr><div class="subhead">${k.entries.length} ${T('journalDate').toLowerCase()}(s)</div>${k.entries.length?[...k.entries].reverse().map(ent=>`<div class="journal-entry"><time>${new Date(ent.date).toLocaleDateString(S.lang==='pt'?'pt-BR':'en-US')}</time><p>${E(ent.text)}</p>${ent.photo?`<img src="${ent.photo}" alt="${E(T('journalPhoto'))}" loading="lazy">`:''}<button class="underlined" data-action="kit-remove-entry" data-id="${E(ent.id)}">${T('remove')}</button></div>`).join(''):`<p class="small muted">${T('journalNone')}</p>`}<div class="notice" style="margin-top:20px">${T('kitCross')} <button class="underlined" data-action="goto" data-view="editor">${T('useSpace')} →</button></div></aside></div></main>`;}
function menuModal(){return `<div class="overlay" data-backdrop="true"><section class="dialog small-dialog" role="dialog" aria-modal="true" aria-label="${T('menu')}"><button class="close-dialog" data-action="close-dialog" aria-label="${T('close')}">×</button><h2>${T('menu')}</h2><div class="menu-options"><button class="secondary" data-action="home">${T('navHome')}</button><button class="secondary" data-action="open-editor">${T('navSpace')}</button><button class="secondary" data-action="open-kit">${T('navKit')}</button><button class="secondary" data-action="library">${T('navProjects')}</button>${S.project?`<button class="inkbtn" data-action="save">${T('save')}</button>`:''}</div></section></div>`;}
function libraryModal(){return `<div class="overlay" data-backdrop="true"><section class="dialog small-dialog" role="dialog" aria-modal="true" aria-labelledby="library-title" tabindex="-1"><button class="close-dialog" data-action="close-dialog" aria-label="${T('close')}">×</button><h2 id="library-title">${T('libraryTitle')}</h2><p>${T('libraryIntro')}</p>${S.library.length?S.library.map(p=>`<div class="project-item"><div><strong>${E(p.name||'Meu espaço')}</strong><small>${new Date(p.updatedAt).toLocaleDateString(S.lang==='pt'?'pt-BR':'en-US')} · ${(p.annotations||[]).length} ${T('marksCount')}</small></div><div class="project-actions"><button class="smallbtn" data-action="load-project" data-id="${E(p.id)}">${T('open')}</button><button class="smallbtn dangerbtn" data-action="remove-project" data-id="${E(p.id)}">${T('remove')}</button></div></div>`).join(''):`<p class="notice">${T('libraryEmpty')}</p>`}<div class="modal-buttons"><button class="secondary" data-action="import-json">${T('importProject')}</button><button class="inkbtn" data-action="new-blank">${T('newProject')}</button></div></section></div>`;}
function reportTemplate(image){const p=S.project,c=p.context,checks=getChecks(),date=new Date().toLocaleDateString(S.lang==='pt'?'pt-BR':'en-US');const row=(k,v)=>`<div><b>${k}</b><br>${E(v||'—')}</div>`;return `<div class="report-view"><header class="report-brand"><img src="${logo}" alt=""><strong>CONFLORA</strong><span style="margin-left:auto;font-size:11px;color:#6D836C">BRaVE 2026</span></header><h1>${T('reportTitle')}</h1><p class="report-meta">${T('reportDate')} ${date} · ${E(p.name)}</p><p>${T('reportSub')}</p><section><h2>${T('reportMap')}</h2><img class="report-shot" src="${image}" alt="${E(T('scene'))}"></section><section><h2>${T('reportKnown')}</h2><div class="report-grid">${row(T('where'),c.region)}${row(T('area'),c.area?c.area+' m²':'')}${row(T('soil'),T(c.soil==='slow'?'soilSlow':c.soil==='medium'?'soilMedium':c.soil==='fast'?'soilFast':'unknown'))}${row(T('sun'),T(c.sun==='full'?'sunFull':c.sun==='mixed'?'sunMixed':c.sun==='shade'?'sunShade':'unknown'))}${row(T('poolingQuestion'),T(c.pooling))}${row(T('observations'),String(p.annotations.length))}</div>${c.notes?`<p>${E(c.notes)}</p>`:''}</section><section><h2>${T('observations')}</h2>${p.annotations.length?`<ul>${p.annotations.map(a=>`<li><b>${T(a.type)}:</b> ${E(a.notes||T('noteEmpty'))}</li>`).join('')}</ul>`:`<p>${T('noMarked')}</p>`}</section><section><h2>${T('nextChecks')}</h2><ol>${checks.map(t=>`<li>${t}</li>`).join('')}</ol></section><p class="report-note">${T('reportCaution')}</p></div>`;}
function reportModal(){return `<div class="overlay" data-backdrop="true"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="report-dialog-title"><button class="close-dialog" data-action="close-dialog" aria-label="${T('close')}">×</button><h2 id="report-dialog-title">${T('openReport')}</h2><p>${T('reportCaution')}</p><div id="report-in-modal">${S.reportHTML||''}</div><div class="modal-buttons"><button class="secondary" data-action="download-annotated">${T('downloadImage')}</button><button class="primary" data-action="print">${T('printPdf')}</button></div></section></div>`;}
function render(){document.documentElement.lang=S.lang==='pt'?'pt-BR':'en';document.title=T('siteTitle');const page=S.project&&S.view!=='home'?S.view==='editor'?projectEditor():S.view==='compare'?compareView():S.view==='plan'?planView():kitView():entry();document.getElementById('app').innerHTML=`<div class="site-shell">${header()}${page}${footer()}</div>${S.dialog==='library'?libraryModal():S.dialog==='report'?reportModal():S.dialog==='menu'?menuModal():''}`;if(S.view==='editor')bindStage();}
function confirmProject(){if(S.project)return true;toast(T('noSpace'));return false;}
function snapshot(){const {image,...rest}=S.project;return {data:JSON.stringify(rest),image};}
function restore(s){S.project={...JSON.parse(s.data),image:s.image};}
function history(){if(!S.project)return;S.history.push(snapshot());if(S.history.length>35)S.history.shift();S.future=[];}
function undo(){if(!S.history.length)return;S.future.push(snapshot());restore(S.history.pop());S.selected=null;dirty();render();}
function redo(){if(!S.future.length)return;S.history.push(snapshot());restore(S.future.pop());S.selected=null;dirty();render();}
let saveTimer;function dirty(){if(!S.project)return;S.dirty=true;const el=document.getElementById('save-status');if(el)el.textContent=T('unsaved');clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveProject(false),1100);}
async function saveProject(notify=true){if(!S.project)return;try{await Store.save(S.project);S.dirty=false;const el=document.getElementById('save-status');if(el)el.textContent=T('saved');if(notify)toast(T('savedToast'));}catch(e){console.warn('Local save:',e);toast(T('offlineFail'));}}
function viewBox(){const w=1000/S.zoom,h=650/S.zoom,x=Ed.clamp(S.panX,0,1000-w),y=Ed.clamp(S.panY,0,650-h);return `${x} ${y} ${w} ${h}`;}
function zoom(direction){const old=S.zoom;S.zoom=Ed.clamp(S.zoom*(direction>0?1.24:.8),1,3.5);const w=1000/S.zoom,h=650/S.zoom;S.panX=Ed.clamp(S.panX+(1000/old-w)/2,0,1000-w);S.panY=Ed.clamp(S.panY+(650/old-h)/2,0,650-h);redrawStage();}
function redrawStage(){const stage=document.getElementById('stage');if(!stage||!S.project)return;const svg=stage.querySelector('svg');if(!svg)return;svg.outerHTML=Ed.svgContent(S.project,{labels:I18N[S.lang],selected:S.selected,viewBox:viewBox(),svgLabel:T('scene')});}
function addMark(x,y,type=S.tool){if(!['pool','roof','paved','plants','space','garden'].includes(type))return;history();const a={id:Store.id(),type,x,y,size:1,notes:''};S.project.annotations.push(a);S.selected=a.id;S.tool='select';dirty();render();toast(T('addedToast'));}
function bindStage(){const stage=document.getElementById('stage');if(!stage)return;let drag=null;
 stage.addEventListener('pointerdown',e=>{if(e.button!==0)return;const svg=stage.querySelector('svg');if(!svg)return;const p=Ed.convertPointer(svg,e);const marker=e.target.closest('[data-marker-id]');
  if(marker&&S.tool==='select'){const id=marker.getAttribute('data-marker-id'),a=S.project.annotations.find(i=>i.id===id);if(!a)return;S.selected=id;history();drag={kind:'marker',id,start:p,x:a.x,y:a.y,moved:false};stage.setPointerCapture(e.pointerId);redrawStage();return;}
  if(S.tool==='pan'){drag={kind:'pan',clientX:e.clientX,clientY:e.clientY,panX:S.panX,panY:S.panY};stage.setPointerCapture(e.pointerId);return;}
  if(S.tool!=='select'){addMark(p.x,p.y,S.tool);return;}
  S.selected=null;render();
 });
 stage.addEventListener('pointermove',e=>{if(!drag)return;const svg=stage.querySelector('svg');if(!svg)return;const p=Ed.convertPointer(svg,e);if(drag.kind==='marker'){const a=S.project.annotations.find(i=>i.id===drag.id);if(!a)return;a.x=Ed.clamp(drag.x+p.x-drag.start.x,20,980);a.y=Ed.clamp(drag.y+p.y-drag.start.y,20,630);drag.moved=true;redrawStage();}else{const b=1000/S.zoom, h=650/S.zoom;S.panX=Ed.clamp(drag.panX-(e.clientX-drag.clientX)*b/Math.max(1,stage.clientWidth),0,1000-b);S.panY=Ed.clamp(drag.panY-(e.clientY-drag.clientY)*h/Math.max(1,stage.clientHeight),0,650-h);redrawStage();}});
 function endDrag(){if(!drag)return;if(drag.kind==='marker'){if(drag.moved)dirty();else S.history.pop();}drag=null;render();}
 stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
 stage.addEventListener('keydown',e=>{if(!S.selected||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const a=selectMark();if(!a)return;history();const d=e.shiftKey?25:10;a.x=Ed.clamp(a.x+(e.key==='ArrowLeft'?-d:e.key==='ArrowRight'?d:0),20,980);a.y=Ed.clamp(a.y+(e.key==='ArrowUp'?-d:e.key==='ArrowDown'?d:0),20,630);dirty();redrawStage();});
 stage.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();zoom(e.deltaY<0?1:-1);},{passive:false});
}
async function newProject(kind,withPhoto=false){if(S.project&&S.dirty)await saveProject(false);S.project=Store.newProject(kind);S.selected=null;S.tool='select';S.zoom=1;S.panX=0;S.panY=0;S.history=[];S.future=[];S.compare=78;S.view=kind==='kit'?'kit':'editor';S.dialog=null;render();await saveProject(false);if(withPhoto)document.getElementById('photo-file').click();}
async function openLibrary(){if(S.dirty)await saveProject(false);try{S.library=(await Store.all()).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));}catch(e){S.library=[];toast(T('offlineFail'));}S.dialog='library';render();}
function checkFileValue(raw){if(!raw||raw.version!==11||!Array.isArray(raw.annotations)||typeof raw.id!=='string'||!raw.context||!raw.kit)return false;if(raw.image&&!/^data:image\/(jpeg|png|webp);base64,/.test(raw.image))return false;return true;}
async function fileLoad(file){try{const raw=JSON.parse(await file.text());if(!checkFileValue(raw))throw Error(T('projectInvalid'));const base=Store.newProject(raw.kind==='kit'?'kit':'space');const p={...base,...raw,id:Store.id(),annotations:raw.annotations.filter(a=>a&&typeof a==='object'&&['pool','roof','paved','plants','space','garden'].includes(a.type)).slice(0,200).map(a=>({id:Store.id(),type:a.type,x:Ed.clamp(+a.x||500,20,980),y:Ed.clamp(+a.y||325,20,630),size:Ed.clamp(+a.size||1,.55,2.4),notes:String(a.notes||'').slice(0,700)})),context:{...base.context,...raw.context},kit:{...base.kit,...raw.kit}};p.name=String(p.name||'Meu espaço').slice(0,100);p.createdAt=Date.now();p.updatedAt=Date.now();p.kit.tasks=Array.isArray(p.kit.tasks)?p.kit.tasks.slice(0,5).map(Boolean):base.kit.tasks;p.kit.entries=Array.isArray(p.kit.entries)?p.kit.entries.slice(0,50).map(e=>({id:Store.id(),text:String(e.text||'').slice(0,1500),date:Number(e.date)||Date.now(),photo:typeof e.photo==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(e.photo)?e.photo:null})):[];S.project=p;S.view='editor';S.dialog=null;S.history=[];S.future=[];S.selected=null;await saveProject(false);render();toast(T('importedToast'));}catch(e){toast(e.message||T('fileFail'));}}
async function makeReport(){try{S.busy=true;const png=await Ed.svgAsPng(null,S.project,{labels:I18N[S.lang]});S.reportPng=png;S.reportHTML=reportTemplate(png);S.dialog='report';render();}catch(e){console.error(e);toast(T('reportFail'));}finally{S.busy=false;}}
async function imageUpload(file,forKit=false){try{const image=await Ed.fileToDataURL(file,forKit?1200:1800);if(forKit){S.pendingKitPhoto=image;render();return;}if(!S.project)S.project=Store.newProject();history();S.project.image=image;S.view='editor';S.dialog=null;dirty();render();toast(T('photoReady'));}catch(e){toast(e.message||T('badFile'));}}
async function mainAction(btn){const action=btn.dataset.action;
 if(action==='home'){S.view='home';S.dialog=null;render();return;}
 if(action==='lang'){S.lang=S.lang==='pt'?'en':'pt';S.dialog=null;render();return;}
 if(action==='library'){await openLibrary();return;}
 if(action==='mobile-menu'){S.dialog='menu';render();return;}
 if(action==='close-dialog'){S.dialog=null;render();return;}
 if(action==='new-photo'){await newProject('space',true);return;}
 if(action==='new-blank'){await newProject('space',false);return;}
 if(action==='new-kit'){await newProject('kit',false);return;}
 if(action==='open-editor'||action==='open-kit'){if(!S.project){await newProject(action==='open-kit'?'kit':'space');return;}S.view=action==='open-kit'?'kit':'editor';S.dialog=null;render();return;}
 if(action==='goto'){if(!confirmProject())return;S.view=btn.dataset.view;S.dialog=null;render();window.scrollTo({top:0,behavior:'auto'});return;}
 if(!S.project&&action!=='import-json')return toast(T('noSpace'));
 if(action==='save'){await saveProject(true);return;}
 if(action==='change-photo'){document.getElementById('photo-file').click();return;}
 if(action==='zoom-in'||action==='zoom-out'){zoom(action==='zoom-in'?1:-1);return;}
 if(action==='zoom-reset'){S.zoom=1;S.panX=0;S.panY=0;redrawStage();return;}
 if(action==='undo'){undo();return;}if(action==='redo'){redo();return;}
 if(action==='add-center'){addMark(500,325,S.tool==='select'?'pool':S.tool);return;}
 if(action==='select-marker'){S.selected=btn.dataset.id;S.tool='select';render();return;}
 if(action==='delete-marker'){if(!S.selected)return;history();S.project.annotations=S.project.annotations.filter(a=>a.id!==S.selected);S.selected=null;dirty();render();return;}
 if(action==='export-json'){Ed.download('conflora-'+S.project.id+'.json',JSON.stringify(S.project,null,2));return;}
 if(action==='import-json'){document.getElementById('project-file').click();return;}
 if(action==='load-project'){if(S.dirty)await saveProject(false);const p=await Store.load(btn.dataset.id);if(p){S.project=p;S.view=p.kind==='kit'?'kit':'editor';S.dialog=null;S.selected=null;S.tool='select';S.history=[];S.future=[];S.zoom=1;S.panX=S.panY=0;render();}return;}
 if(action==='remove-project'){if(!window.confirm(T('confirmDelete')))return;await Store.remove(btn.dataset.id);if(S.project?.id===btn.dataset.id){S.project=null;S.view='home';}await openLibrary();toast(T('deletedToast'));return;}
 if(action==='kit-photo'){document.getElementById('kit-photo-file').click();return;}
 if(action==='kit-add-entry'){const note=document.getElementById('journal-note')?.value?.trim();if(!note&&!S.pendingKitPhoto){toast(T('journalText'));return;}history();S.project.kit.entries.push({id:Store.id(),date:Date.now(),text:note||'',photo:S.pendingKitPhoto||null});S.pendingKitPhoto=null;dirty();render();return;}
 if(action==='kit-remove-entry'){history();S.project.kit.entries=S.project.kit.entries.filter(e=>e.id!==btn.dataset.id);dirty();render();return;}
 if(action==='report'){await makeReport();return;}
 if(action==='print'){const print=document.getElementById('print-target');print.innerHTML=S.reportHTML||'';window.print();return;}
 if(action==='download-annotated'){if(S.reportPng){const a=document.createElement('a');a.href=S.reportPng;a.download='conflora-espaco-anotado.png';a.click();}return;}
}
document.addEventListener('click',async e=>{const tool=e.target.closest('.rail-tool[data-tool]');if(tool){S.tool=tool.dataset.tool;S.selected=null;render();return;}const action=e.target.closest('[data-action]');if(action){e.preventDefault();try{await mainAction(action);}catch(err){console.error(err);toast(T('fileFail'));}return;}const backdrop=e.target.closest('[data-backdrop]');if(backdrop&&e.target===backdrop){S.dialog=null;render();}});
document.addEventListener('pointerdown',e=>{if(e.target.matches('[data-marker-size]')&&selectMark())history();});
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-compare]')){S.compare=+el.value;const place=document.querySelector('.workspace-stage svg');if(place)place.outerHTML=Ed.svgContent(S.project,{labels:I18N[S.lang],compare:true,fraction:S.compare,beforeText:T('before'),afterText:T('after'),svgLabel:T('scene')});return;}if(el.matches('[data-marker-size]')){const a=selectMark();if(a){a.size=+el.value;dirty();redrawStage();}return;}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='photo-file'){if(el.files[0])imageUpload(el.files[0]);el.value='';return;}if(el.id==='project-file'){if(el.files[0])fileLoad(el.files[0]);el.value='';return;}if(el.id==='kit-photo-file'){if(el.files[0])imageUpload(el.files[0],true);el.value='';return;}
 if(!S.project)return;
 if(el.matches('[data-project-name]')){history();S.project.name=el.value.trim().slice(0,100)||T('projectName');dirty();return;}
 if(el.matches('[data-context]')){const k=el.dataset.context;if(k in S.project.context){history();S.project.context[k]=el.value;dirty();}return;}
 if(el.matches('[data-marker-notes]')){const a=selectMark();if(a){history();a.notes=el.value.slice(0,700);dirty();}return;}
 if(el.matches('[data-marker-pos]')){const a=selectMark();if(a){history();const k=el.dataset.markerPos;a[k]=Ed.clamp(+el.value,k==='x'?20:20,k==='x'?980:630);dirty();redrawStage();}return;}
 if(el.matches('[data-kit-code]')){history();S.project.kit.code=el.value.slice(0,100);dirty();return;}
 if(el.matches('[data-kit-task]')){history();S.project.kit.tasks[+el.dataset.kitTask]=el.checked;dirty();return;}
});
