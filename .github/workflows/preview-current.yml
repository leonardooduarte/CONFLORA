name: CONFLORA — Preview Atualizada

on:
  push:
    branches:
      - fix/herbarium-from-current-20261116
    paths:
      - "projeto/**"
      - ".github/workflows/preview-current.yml"

permissions:
  contents: write

concurrency:
  group: conflora-preview-current
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da base mais recente
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projeto/package-lock.json

      - name: Instalar
        working-directory: projeto
        run: npm ci

      - name: Verificar, testar e compilar
        working-directory: projeto
        run: |
          npm run build
          npm test
          npm run test:selection

      - name: Publicar apenas prévia, mantendo site principal
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./projeto/dist
          destination_dir: previews/herbarium-20261116
          keep_files: true
          commit_message: "Refresh Herbarium preview from latest image direction: ${{ github.sha }}"
