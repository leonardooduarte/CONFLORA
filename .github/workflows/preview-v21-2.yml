name: CONFLORA V21.2 — Integrated experience preview

on:
  workflow_dispatch:
  push:
    branches:
      - feat/conflora-v21-2-integrated-experience
    paths:
      - 'projeto/src/**'
      - 'projeto/public/demo/**'
      - 'projeto/tests/v21-2-*'
      - 'projeto/docs/v21-2/**'
      - '.github/workflows/preview-v21-2.yml'

permissions:
  contents: write

concurrency:
  group: conflora-v21-2-integrated-experience
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projeto/package-lock.json
      - name: Install locked dependencies
        working-directory: projeto
        run: npm ci --no-audit --no-fund
      - name: Build and scientific regression
        working-directory: projeto
        run: |
          npm run build
          npm test
          npm run test:selection
          node tests/v19-model.mjs
          node tests/herbarium-complete.mjs
          node tests/v20-model.mjs
          node tests/v21-model.mjs
          node tests/v21-1-model.mjs
          node tests/v21-2-model.mjs
          node scripts/v21-1-media-audit.mjs
      - name: Install Chromium and PDF analysis
        working-directory: projeto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          npx playwright install --with-deps chromium
          sudo ln -sf "$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" /usr/bin/chromium
      - name: Browser, accessibility and prior-version regression
        working-directory: projeto
        run: |
          npm run dev -- --port 5176 > /tmp/conflora-v21-2-vite.log 2>&1 &
          for n in $(seq 1 45); do if curl -fsS http://127.0.0.1:5176/ >/dev/null; then break; fi; sleep 1; done
          node tests/v21-2-browser.mjs
          node tests/v21-1-browser.mjs
          node tests/v21-browser.mjs
          node tests/v20-browser.mjs
          node tests/v19-browser.mjs
          node tests/v19-visual-regressions.mjs
          node tests/herbarium-complete-browser.mjs
          npm run test:six
      - name: Production-build synthetic performance audit (Lighthouse)
        working-directory: projeto
        continue-on-error: true
        run: |
          npm run preview -- --port 5180 > /tmp/conflora-v21-2-prod-preview.log 2>&1 &
          for n in $(seq 1 45); do if curl -fsS http://127.0.0.1:5180/ >/dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:5180/ >/dev/null
          npm exec --yes --package=lighthouse@12 -- lighthouse http://127.0.0.1:5180/ --chrome-path=/usr/bin/chromium --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --enable-unsafe-swiftshader" --output=json --output-path=work/v21-2/lighthouse-home.json --quiet
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('work/v21-2/lighthouse-home.json'));const keys=['first-contentful-paint','largest-contentful-paint','cumulative-layout-shift','total-blocking-time','speed-index','interaction-to-next-paint'];const x={audit:'production-build',measurement:'mobile lab simulated',version:j.lighthouseVersion,fetchTime:j.fetchTime,scores:Object.fromEntries(Object.entries(j.categories||{}).map(([k,v])=>[k,Math.round(v.score*100)])),metrics:Object.fromEntries(keys.map(k=>[k,j.audits[k]?.numericValue??null]))};fs.writeFileSync('work/v21-2/lighthouse-summary.json',JSON.stringify(x,null,2));console.log('PRODUCTION LIGHTHOUSE '+JSON.stringify(x));"
      - name: Package screenshots, inventories and version metadata
        working-directory: projeto
        run: |
          mkdir -p dist/review/before dist/review/after
          cp work/v21-2/*.png dist/review/after/
          cp work/v21-2/validation.json dist/review/
          cp work/v21-1/media-inventory.json dist/review/media-inventory.json
          if [ -s work/v21-2/lighthouse-home.json ]; then
            cp work/v21-2/lighthouse-home.json dist/review/lighthouse-home.json
          fi
          if [ -s work/v21-2/lighthouse-summary.json ]; then
            cp work/v21-2/lighthouse-summary.json dist/review/lighthouse-summary.json
          fi
          git fetch -q origin gh-pages:refs/remotes/origin/gh-pages
          for file in home-1440.png home-390.png editor-1440.png itapeva-1440.png iowa-1440.png; do
            git show origin/gh-pages:previews/conflora-v21-1/review/after/$file > dist/review/before/$file || rm -f dist/review/before/$file
          done
          node -e "const fs=require('fs');const p='dist/version.json';const old=JSON.parse(fs.readFileSync(p));fs.writeFileSync(p,JSON.stringify({...old,version:'21.2.0-preview',edition:'Jornada e resultados integrados',deployment:'preview',sourceBranch:'feat/conflora-v21-2-integrated-experience',sourceCommit:process.env.GITHUB_SHA,previewPath:'/CONFLORA/previews/conflora-v21-2/'},null,2))"
      - name: Archive test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conflora-v21-2-validation
          path: |
            projeto/work/v21-2/
            projeto/work/v21-1/
            projeto/work/v21/
            projeto/work/v20/
            projeto/work/v19/
          retention-days: 14
      - name: Publish only the V21.2 preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./projeto/dist
          destination_dir: previews/conflora-v21-2
          keep_files: true
          commit_message: 'CONFLORA V21.2 preview only: ${{ github.sha }}'
